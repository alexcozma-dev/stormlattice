# StormLattice settings. Values marked "tune" are starting guesses to fit on validation days.

grid:
  # Florida box (degrees) on MRMS's own 0.01 deg lat/lon grid. No reprojection.
  # Each span must be a whole number of 0.08 deg blocks: 7.20 deg = 90 blocks, 9.12 deg = 114.
  lat_min: 23.80
  lat_max: 31.0
  lon_min: -87.52
  lon_max: -78.40

archive:
  cadence_min: 10                 # one slot per 10-minute mark
  storm_day_start_hour_utc: 10    # a storm day runs 10:00 UTC to 10:00 UTC, named by its start date
  max_frame_offset_min: 4         # a 10-minute slot with no frame this close is stored as all-NaN

storms:
  threshold_dbz: 35               # tune: 35-40

labels:
  window_min: 10                  # a birth at lead L happens in [t0+L, t0+L+10 min]
  min_cells: 4                    # storm cells needed in the block ...
  persist_frames: 2               # ... for this many frames in a row
  quiet_before_min: 20            # the block held no storm for this long before the window
  # tune: equals headroom_distance_km so the headroom test measures the label ceiling;
  # revisit after the label sanity check
  advected_tolerance_km: 10
  edge_margin_km: 72              # 15 m/s x 80 min: storms from outside can't reach the scored region

checks:
  headroom_distance_km: 10        # "new" storm area lies farther than this from the advected t0 storms
  buffer_test_km: [5, 10, 20]     # route buffers to compare on observed radar

forecast:
  lead_times_min: [10, 20, 30, 45, 60]
  lattice_step_min: 5
  ensemble_members: 200

risk:
  buffer_km: 20                   # operator-adjustable
  green_below: 0.10               # placeholder thresholds, operator sets these
  red_above: 0.30
  max_data_age_min: 10            # older radar -> advisory unavailable

route:
  # Demo corridor: SunTrax (Auburndale) to Orlando International Airport.
  suntrax_lonlat: null            # fill in: 100 Transformation Way, Auburndale
  mco_lonlat: [-81.309, 28.413]   # from OpenStreetMap
  cruise_speed_kmh: 241           # about 150 mph

data:
  mrms_bucket: "noaa-mrms-pds"
