# /etc/nginx/sites-available/storm  (replaces the static-page version once the app runs)
# Static front-end from web/, API proxied to the FastAPI container on 127.0.0.1:8000.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name storm.alexcozma.dev;

    ssl_certificate     /etc/ssl/cloudflare/storm.pem;
    ssl_certificate_key /etc/ssl/cloudflare/storm.key;

    root /home/alexcozma/stormlattice/web;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
