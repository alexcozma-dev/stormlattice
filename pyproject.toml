[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stormlattice*"]

[project]
name = "stormlattice"
version = "0.1.0"
description = "Learned-rate stochastic nowcasting of Florida thunderstorms for Advanced Air Mobility"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"
