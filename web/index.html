<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StormLattice</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f1419; color: #e6e6e6; }
    header { padding: 16px 24px; border-bottom: 1px solid #2a2f36; }
    h1 { margin: 0; font-size: 20px; }
    .banner { display: inline-block; margin-top: 8px; padding: 2px 8px; border-radius: 4px;
              background: #3a2f10; color: #f0c040; font-size: 12px; letter-spacing: 0.05em; }
    main { padding: 24px; }
    footer { position: fixed; bottom: 0; width: 100%; padding: 8px 24px; font-size: 12px;
             color: #8a8f96; border-top: 1px solid #2a2f36; background: #0f1419; }
  </style>
</head>
<body>
  <header>
    <h1>StormLattice</h1>
    <span class="banner" id="mode">LOADING</span>
  </header>
  <main>
    <p>Map, route card and briefing panel go here (Step 10).</p>
  </main>
  <footer id="disclaimer">Prototype. Not for operational flight decisions.</footer>
  <script>
    fetch("/api/meta").then(r => r.json()).then(m => {
      document.getElementById("mode").textContent =
        m.mode === "live" ? "LIVE" : m.mode === "replay" ? "HISTORICAL REPLAY" : "SIMULATED";
      document.getElementById("disclaimer").textContent = m.disclaimer;
    }).catch(() => { document.getElementById("mode").textContent = "API OFFLINE"; });
  </script>
</body>
</html>
